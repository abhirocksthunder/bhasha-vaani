next_priorities:
  - apps/web_pwa - run `npm run dev` (or `npm run build`) on the user's actual Windows machine to verify the full app (all phases) works end to end; this session only verified via `tsc -b` and `vite build`'s module-transform step, since the sandbox's D:\ mount blocked the final unlink/minify steps for environment reasons unrelated to the code (see BV-WEBPWA-PARITY-001)
  - apps/web_pwa - manually confirm `Generate plan` actually produces a lesson from a local Ollama model end-to-end in the new frontend (same underlying reliability question as Stage 1.1 below, now needs checking through both frontends)
  - decide when to retire apps/mobile_flutter now that apps/web_pwa has full parity -- see BV-WEBPWA-RETIRE-001, deliberately left as an open decision rather than auto-deleting the Flutter app
  - apps/web_pwa - consider adding vite-plugin-pwa later for richer PWA features (precache manifests, update-prompt UX) if the hand-written public/sw.js turns out to be insufficient; its dependency tree failed to install through this sandbox's D:\ mount during phase 1 (see ADR-004), a normal local `npm install` on Windows should not have the same problem
  - Stage 1.1 - validate the new lesson-generation retry/repair loop against a real running Ollama instance (5 consecutive generations, no manual retry); this will also reveal the real reason Generate plan was rejecting every attempt for the user
  - backfill native_script for any future catalog items and consider requiring it in language pack validation
  - verify `flutter build web --wasm` succeeds on the user's installed Flutter SDK version (requires WasmGC/dart2wasm support); if it errors, the SDK likely needs an upgrade
  - verify the wasm build actually loads correctly in the user's browser (flutter_bootstrap.js should auto-fallback to JS on unsupported browsers, but this has not been manually confirmed)
  - once a profile has completed all 12 Kannada catalog phrases, generated plans fall back to pure review since the catalog is intentionally small right now -- expanding curriculum size is the real fix (see near-term roadmap in CLAUDE.md)
  - Stage 1.3 "teach me X" launcher shipped 2026-08-02 -- needs live-Ollama validation on the user's machine (parsing/routing is unit-tested, but end-to-end model behavior with request_text hasn't been confirmed for real)
  - Stage 1.2/1.4 remaining: add a per-item mastery/strength score to activity_completed events (no score signal exists yet, so "weak items first" isn't implemented, only "not-yet-completed first"), and a session recap screen referencing prior sessions
  - Stage 2 - build two-bot scenario conversation studio (scenario contract, multi-voice TTS, playback/transcript UI)
  - Stage 3 - build personalized voice tutor (STT for comfortable language, consistent per-profile TTS voice, bilingual turn-taking)
  - add structured generation repair and model-specific provider settings
  - add stronger native mobile offline database later
  - run frontend on port 6002 and backend on port 6001 during local development
  - avoid frontend port 6000 because Chromium blocks it as unsafe

known_risks:
  - Firebase remote frontend requires secure backend tunnel and auth (now applies to apps/web_pwa, the primary client per ADR-004, not apps/mobile_flutter)
  - local PC backend availability depends on machine uptime and network
  - no native Android app exists or is currently planned from either frontend (ADR-004 deliberately dropped that goal when apps/web_pwa was chosen); a native app would be a new decision if wanted later
  - apps/web_pwa's speech-to-text (Web Speech API) is reliably supported only in Chromium-based browsers, same class of limitation as Flutter's speech_to_text had, not a regression
  - queued offline events are durable locally, but retry controls are still basic
  - local Ollama models tested so far can produce malformed or empty JSON for lesson generation
