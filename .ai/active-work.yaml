id: BV-ADAPTIVELESSON-001
title: Adaptive lessons and two-model reviewed generation
status: in_progress
owner_agent: voice-agent

objective:
  Replace fixed starter lessons with language-pack backed lesson catalogs, persist adaptive plans, and generate reviewed lesson plans through local provider gateway models.

relevant_paths:
  - apps/api/
  - platform/provider_gateway/
  - apps/mobile_flutter/
  - language_packs/

acceptance_criteria:
  - starter lessons come from language-pack curriculum catalogs
  - backend persists active lesson plans
  - Flutter can request plan generation
  - tutor and reviewer model outputs are validated before persistence
  - malformed model output is rejected safely

completed:
  - Flutter-first foundation completed
  - glossy mobile-first UI stage completed
  - backend dev API exposes profiles and languages
  - backend dev API accepts idempotent progress events
  - Flutter app has API repositories for profiles, languages, and progress
  - lesson completion posts activity_completed events to backend
  - backend storage is SQLite-backed and survives process restarts
  - backend route and storage tests cover seed data and idempotent progress events
  - Flutter app has polished loading, empty, retryable error, and offline queue states
  - Flutter tests cover backend-unavailable fallback UI
  - backend defines typed ProgressEventEnvelope
  - Flutter defines typed ProgressEvent
  - tests cover backend contract validation and Flutter serialization
  - failed progress event uploads are saved in durable Flutter outbox storage
  - queued outbox count is visible in lesson and progress UI
  - retry attempts upload queued events idempotently when backend reconnects
  - Flutter tests cover outbox persistence and duplicate queue behavior
  - language manifest JSON Schema added
  - Kannada manifest validates
  - invalid manifest tests produce actionable errors
  - validator emits backend-shaped language capability data
  - Hindi starter manifest added and validates
  - backend SQLite language seed upserts from validated manifests
  - /languages serves Kannada full and Hindi preview after backend restart
  - /languages reads validated manifests directly at runtime
  - tests cover manifest-derived language registry output
  - Languages tab shows visible manifest registry strip and pack count
  - backend rejects unsupported progress event schema versions
  - docs explain progress event versioning rules
  - profile edit bottom sheet added
  - Kannada starter lesson expanded to six activities
  - confusing outbox wording changed to offline sync wording
  - FastAPI dependencies installed in apps/api/.api-venv
  - live backend now runs with Uvicorn/FastAPI on port 6001
  - floating tutor pet UI added to Flutter
  - /assistant/word endpoint added and tested
  - tutor pet calls local Ollama through provider gateway
  - tutor pet shows installed Ollama model tags
  - one-click launcher added for backend and frontend
  - Kannada starter curriculum moved to language pack and expanded to 12 items
  - Hindi starter curriculum catalog added
  - SQLite lesson plan and lesson item persistence added
  - /lesson-journey/generate added with tutor/reviewer model flow
  - Flutter lesson screen has Generate plan action

remaining:
  - tune local Ollama models for reliable JSON lesson generation
  - add deterministic JSON repair constrained by language-pack catalogs
  - improve generated lesson quality scoring beyond structural validation

last_handoff:
  summary: Adaptive lesson stage started; catalog-backed lessons now show more than six items, while local two-model generation is implemented but safely rejects unreliable JSON.
  changed_files:
    - .ai/
    - apps/mobile_flutter/
    - apps/api/
    - domains/
  warnings:
    - Keep backend on 6001 and frontend on 6002 locally; Chromium blocks frontend port 6000.
    - Local Ollama model combinations tested during generation returned malformed or empty JSON; backend rejects these rather than saving bad lesson plans.
