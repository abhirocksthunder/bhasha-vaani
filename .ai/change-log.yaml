    validation:
      - python3 -m unittest discover -s tests (apps/api, no backend changes needed for this feature) -> 29 tests passing
      - flutter/dart toolchain unavailable in this sandbox; flutter analyze/test/build required before merging
    manual_checks:
      - extracted the previously-duplicated OllamaModel class (was only in tutor_pet_button.dart) into core/api/ollama_model.dart and confirmed tutor_pet_button.dart still compiles logically against the shared import
      - traced the new data flow: LearningSessionScreen fetches GET /providers/ollama/models on initState -> dropdown selection stored in selectedOllamaModel -> passed to widget.onGenerateLessonPlan(selectedOllamaModel) -> bhasha_vaani_app.dart's _generateLessonPlan(ollamaModel) -> lessonRepository.generateJourneyActivities(ollamaModel: ollamaModel) -> both tutor_model and reviewer_model sent as "ollama:<model>" instead of the hardcoded "local_ollama"
      - confirmed LearningSessionScreen's apiBaseUrl (String, previously unused in the widget body) was replaced with apiClient (ApiClient instance) rather than kept alongside it, since nothing else in the file referenced apiBaseUrl
    warnings:
      - flutter pub get/analyze/test/build web still not run in this sandbox -- LearningSessionScreen's constructor signature changed (apiBaseUrl removed, apiClient added; onGenerateLessonPlan now takes a String? parameter), so this needs real compilation to confirm.
      - If Ollama is not running or has zero models installed, the dropdown shows an empty list with a "No installed models found" helper message rather than blocking Generate plan; clicking Generate plan with no model selected falls back to the gateway's default ("local_ollama" route), same as before this change.
    next_steps:
      - Compile/run on the real machine and confirm the dropdown populates with installed models and that picking a specific model actually changes tutor_model/reviewer_model in the generated plan response.

  - date: 2026-07-31
    id: BV-WASMBUILD-WHITESCREEN-001
    summary: Fixed first-load white-screen issue and switched to a WebAssembly release build for the Flutter frontend. Root cause was Start BhashaVaani.cmd opening the browser on a fixed 8s timer while the debug `flutter run -d web-server` dev server was still compiling; a hard refresh later (after compilation caught up) then worked. Replaced the debug dev server with `flutter build web --wasm` served as static files, and replaced the fixed timer with a polling wait script that only opens the browser once the server actually responds.
    changed_paths:
      - scripts/start-frontend.ps1
      - scripts/wait-for-frontend.ps1
      - Start BhashaVaani.cmd
      - CLAUDE.md
      - .ai/current-state.yaml
      - .ai/known-issues.yaml
      - .ai/change-log.yaml
    validation:
      - manual read-through of the new PowerShell scripts and the updated .cmd file for syntax correctness
      - could NOT run `flutter build web --wasm` in this sandbox (no Flutter SDK available) -- must be verified on the user's machine
    warnings:
      - "`flutter build web --wasm` requires a Flutter SDK version with WasmGC/dart2wasm support. If the build step in scripts/start-frontend.ps1 fails, the SDK likely needs an upgrade (`flutter upgrade`)."
      - The frontend workflow changed from a live dev server to build-then-serve. Every Flutter/Dart code change now requires a full `flutter build web --wasm` (slower than the old dev server's near-instant first response, though it removes the white-screen race). This is already reflected in CLAUDE.md's Local Dev Refresh Workflow section.
      - wait-for-frontend.ps1 has a 240s timeout; on a very slow first build it may open the browser too early (with a "still building" console message) or the user may need to just wait and refresh once more. Not yet tuned against a real build on the user's machine.
      - scripts/start-frontend.ps1 falls back to a bare `python` on PATH if the apps/api virtual environment python is not found; if neither is available, serving will fail (build itself does not depend on Python, only the static-file-serving step does).
    next_steps:
      - Run `Start BhashaVaani.cmd` on the real machine and confirm both the wasm build succeeds and the page loads correctly on first try (no white screen, no manual hard refresh needed).
      - If the build is consistently slow, consider caching/incremental strategies or reverting to a debug dev server with a proper loading indicator instead, as a fallback.

