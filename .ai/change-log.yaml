changes:
  - date: 2026-08-02
    id: BV-PROGRESS-SCOPE-001
    summary: "Fixed the Progress tab's \"Completed\" count being cross-language and duplicate-inflated (reported: \"only Hindi shown, no Kannada phrases, completed shows 53\"). storage.progress_summary() now takes an optional language_code and reuses get_learned_words's phrase-level dedup instead of a raw COUNT(DISTINCT entity_id) across all languages. That inflated global count was feeding lesson_journey.recommend_lesson_journey()'s next_index/state calc, so once it exceeded a language's own catalog size, every activity in that language showed as already \"completed\" with nothing left. /lesson-journey, /lesson-journey/generate, and GET /profiles/{id}/progress (new ?language_code= query param) all now scope by the request's language; both frontends' progress repositories updated to pass it."
    changed_paths:
      - apps/api/app/storage.py
      - apps/api/app/main.py
      - apps/api/tests/test_storage.py
      - apps/api/tests/test_dev_server.py
      - apps/web_pwa/src/features/progress/progressRepository.ts
      - apps/mobile_flutter/lib/features/progress/domain/progress_repository.dart
      - .ai/known-issues.yaml
    validation:
      - "python -m unittest discover -s tests (47 passed)"
      - "npx tsc -b --noEmit (clean)"

  - date: 2026-08-02
    id: BV-LEARNEDWORDS-DEDUP-001
    summary: "Fixed learned-words history showing the same phrase as separate \"duplicate\" rows after a learner regenerated a plan and relearned it (a regenerated plan gives the same catalog phrase a new activity_id each time). storage.get_learned_words now groups by (language, phrase, meaning) and returns a times_completed count instead of grouping by raw activity_id. apps/web_pwa's Progress tab shows a \"xN\" badge when times_completed > 1. Also replaced the dead-end disabled Next button at the end of a plan with a \"Learn more words\" action that triggers Generate plan directly. Roadmap statuses (docs/product/roadmap-learning-features.md, both frontends' roadmap tabs) updated to reflect Stage 1.1 and 1.3 as completed and Stage 1.2's improved (but still partial) status."
    changed_paths:
      - apps/api/app/storage.py
