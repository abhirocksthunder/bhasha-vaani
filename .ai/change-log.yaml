changes:
  - date: 2026-07-31
    id: BV-FASTAPI-PET-001
    summary: Switched live backend to FastAPI/Uvicorn and added floating tutor pet word assistant with language/model selectors.
    changed_paths:
      - apps/api/.api-venv/
      - apps/api/pyproject.toml
      - apps/api/README.md
      - apps/api/app/main.py
      - apps/api/app/word_assistant.py
      - apps/api/dev_server.py
      - apps/api/tests/test_word_assistant.py
      - apps/api/tests/test_dev_server.py
      - apps/mobile_flutter/lib/app/home_shell.dart
      - apps/mobile_flutter/lib/app/bhasha_vaani_app.dart
      - apps/mobile_flutter/lib/features/tutor_pet/
      - .gitignore
      - .ai/current-state.yaml
      - .ai/active-work.yaml
    validation:
      - pip install -e .
      - uvicorn app.main:app --host 127.0.0.1 --port 6001
      - python -m unittest discover -s tests
      - flutter analyze
      - flutter test
      - flutter build web --dart-define=BHASHAVAANI_API_URL=http://127.0.0.1:6001 --dart-define=BHASHAVAANI_ENV=local
      - manual POST /assistant/word

