  - date: 2026-08-02
    id: BV-CATALOG-GEN-003
    summary: Fixed newly-approved Catalog-tab phrases not appearing in generated plans. The tutor/reviewer models only got a soft "prefer not-yet-learned phrases" hint and kept re-picking familiar catalog items even after the catalog grew (Kannada 12->22, Hindi ~4->16). Added a deterministic backend top-up step (_ensure_new_phrase_coverage) that fills in not-yet-completed catalog items the model didn't select, so catalog growth reliably shows up in plans instead of depending on model behavior.
    changed_paths:
      - apps/api/app/lesson_generator.py
      - apps/api/tests/test_lesson_generator.py
      - apps/api/tests/test_lesson_catalog.py
      - .ai/known-issues.yaml
    validation:
      - "python -m unittest discover -s tests (34 passed)"

  - date: 2026-08-01
    id: BV-PROGRESSFIX-HISTORY-001
    summary: Fixed Next not saving progress (root cause of "same phrases again"), fixed native_script being lost on plan reload, added a learned-words history list to the Progress tab, and made lesson regeneration prefer not-yet-learned catalog phrases over already-completed ones.
    changed_paths:
      - apps/mobile_flutter/lib/features/learning_session/presentation/learning_session_screen.dart
      - apps/api/app/storage.py
      - apps/api/app/lesson_catalog.py
      - apps/api/app/main.py
      - apps/api/app/lesson_generator.py
      - apps/api/tests/test_storage.py
      - apps/api/tests/test_lesson_generator.py
      - apps/mobile_flutter/lib/features/progress/domain/learned_word.dart
      - apps/mobile_flutter/lib/features/progress/domain/progress_repository.dart
      - apps/mobile_flutter/lib/features/progress/presentation/progress_screen.dart
      - apps/mobile_flutter/lib/app/bhasha_vaani_app.dart
      - apps/mobile_flutter/lib/core/config/build_info.dart
      - .ai/current-state.yaml
      - .ai/change-log.yaml
    validation:
      - python3 -m unittest discover -s tests (apps/api) -> 33 tests passing (added native_script round-trip tests, learned-words resolution/filter/dedupe tests, and a tutor-prompt coverage-instruction test)
      - python3 tools/validate_language_packs.py -> valid: true
      - flutter/dart toolchain unavailable in this sandbox; flutter analyze/test/build still required
    manual_checks:
      - "root-caused the user's "8 phrases, then same phrases again" report to two separate things: (1) the Next button never called onActivityCompleted, so completed_activities stayed 0 server-side no matter how far a user paged through a lesson with Next/Back; (2) even when Complete was clicked, regenerating a plan had no signal about which catalog phrases were already covered, so it could legitimately reproduce an overlapping set from the same 12-item Kannada catalog"
      - traced native_script's journey end-to-end: was present in the direct /lesson-journey/generate response (already fixed last round) but silently dropped by the very next _refreshProgress() -> _refreshLessonJourney() call because lesson_items had no column to store it in -- fixed with an ALTER TABLE migration plus updated INSERT/SELECT
      - traced get_learned_words' dual resolution path (lesson_items+lesson_plans join for generated activities, per-language starter catalog lookup for catalog activities) against three event types in a new test: catalog completion, generated-plan completion, and an unresolvable/deleted activity id (correctly skipped, not shown blank)
    warnings:
      - flutter pub get/analyze/test/build web NOT run in this sandbox. This round changed a StatefulWidget's internal navigation method (_next is now async) and added new required-with-defaults constructor params to ProgressScreen -- verify compilation before relying on this.
      - The "prefer not-yet-learned phrases" instruction is a prompt hint, not a hard filter -- the model can still ignore it. Backend validation still only enforces catalog membership + completeness, not novelty, consistent with the existing "AI decides content, backend validates safety/schema" split.
      - Once all 12 Kannada catalog phrases are marked completed, new plans necessarily become pure review (there is nothing new left to prefer). This is expected given the current catalog size, not a bug -- documented in current-state.yaml's next_priorities.
      - dev_server.py (the lightweight standalone dev server) was NOT updated with a matching /profiles/{id}/learned-words route or native_script column awareness. It's a secondary path exercised mainly by tests, not the live FastAPI backend Start BhashaVaani.cmd runs -- flagging as a known parity gap rather than fixing now.
    next_steps:
      - Verify in the running app that clicking Next without pressing Complete now correctly increments completed_activities and that a full 8-item generated plan doesn't "reset" on revisit.
      - Verify the Progress tab's Learned words list populates and updates as activities are completed.
      - Consider whether dev_server.py needs the learned-words route for parity, or whether it should be retired now that uvicorn is the documented live backend.

