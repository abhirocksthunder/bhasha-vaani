  - apps/mobile_flutter/lib/features/progress/domain/progress_summary.dart
  - apps/mobile_flutter/lib/features/learning_session/presentation/learning_session_screen.dart

decisions:
  - Use the `http` package for cross-platform Flutter API calls.
  - Keep seeded data as fallback while the local backend is still a dev server.
  - Keep progress event upload idempotent through `event_id`.

tests:
  passed:
    - flutter pub get
    - flutter analyze
    - flutter test
    - flutter build web --dart-define=BHASHAVAANI_API_URL=http://127.0.0.1:6001 --dart-define=BHASHAVAANI_ENV=local
    - GET /profiles
    - POST /progress/events duplicate check
  not_run:
    - backend automated route tests

remaining:
  - Move backend from standard-library dev server to real FastAPI with persistent storage.
  - Add typed progress event models.
  - Add polished loading, empty, offline, and error states.
  - Add backend route tests.

warnings:
  - Progress events are still in memory and reset when the dev backend restarts.
