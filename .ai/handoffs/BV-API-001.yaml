task_id: BV-API-001
status: in_progress

summary:
  Started the API-backed data stage. The dev backend now exposes profiles, languages, learning session creation, progress summaries, and idempotent progress event recording. The Flutter app now has API repositories and records lesson completion through the backend.

changed_files:
  - apps/api/dev_server.py
  - apps/mobile_flutter/pubspec.yaml
  - apps/mobile_flutter/pubspec.lock
  - apps/mobile_flutter/lib/core/api/api_client.dart
  - apps/mobile_flutter/lib/app/bhasha_vaani_app.dart
  - apps/mobile_flutter/lib/features/profiles/domain/profile_repository.dart
  - apps/mobile_flutter/lib/features/profiles/domain/learner_profile.dart
  - apps/mobile_flutter/lib/features/language_selection/domain/language_repository.dart
