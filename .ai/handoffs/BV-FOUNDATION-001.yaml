decisions:
  - Flutter is the primary client technology.
  - Flutter Web will be deployed to Firebase Hosting when remote access is needed.
  - Backend stays local-first and will expose APIs through a secure tunnel.
  - Local models are default; frontier models are optional through provider gateway.

