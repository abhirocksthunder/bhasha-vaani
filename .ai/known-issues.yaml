issues:
  - id: BV-PROGRESS-SCOPE-001
    status: resolved
    severity: high
    title: "\"Completed\" count was cross-language and duplicate-inflated, corrupting per-language lesson state (reported as \"no Kannada phrases, only Hindi, completed shows 53\")"
    details: Reported 2026-08-02. Root cause was in apps/api/app/storage.py's progress_summary(): completed_activities was `COUNT(DISTINCT entity_id)` across ALL languages for the profile, with no language filter, and entity_id isn't a stable phrase identity -- a regenerated lesson plan mints a brand-new activity_id for the same catalog phrase every time (see BV-LEARNEDWORDS-DEDUP-001, filed for the same underlying issue in the Progress tab's word list). Both problems compounded: the user's real distinct-phrase count was much smaller than 53, and Hindi completions were being added into what should have been a Kannada-only count. That inflated global number then fed apps/api/app/lesson_journey.py's recommend_lesson_journey() next_index/state calculation for the starter-catalog fallback -- once the (wrong) completed count exceeded the Kannada catalog's own size, every Kannada activity was marked "completed" with nothing left as "next", which is why Kannada appeared to have no phrases while Hindi (whose catalog is bigger, or was queried instead) still showed content.

      FIXED: progress_summary(profile_id, language_code=None) now reuses get_learned_words's (language, phrase, meaning) dedup instead of a raw distinct-entity_id count, and both apps/api/app/main.py's /lesson-journey and /lesson-journey/generate handlers now pass the request's own language_code through instead of computing a global figure. GET /profiles/{profile_id}/progress accepts an optional ?language_code= query param for the same reason; both apps/web_pwa's progressRepository and apps/mobile_flutter's progress_repository.dart now pass the currently selected language. Covered by a new test (test_progress_summary_is_scoped_per_language_and_deduped in test_storage.py) asserting per-language and global counts are each correct and deduped. Two existing tests (test_storage.py's idempotency test, test_dev_server.py's lesson-journey route test) used a synthetic entity_id that didn't resolve to any real catalog/generated activity, which used to still count under the old raw-count logic; updated both to use a real catalog id (kn_a1_starter_01), since an unresolvable event can no longer be resolved to a phrase to dedupe by, consistent with get_learned_words's existing behavior of skipping unresolvable events.

  - id: BV-WEBPWA-RETIRE-001
    status: open
    severity: low
    title: apps/mobile_flutter (legacy) has not been deleted/archived yet
    details: As of 2026-08-02, apps/web_pwa reached feature parity with apps/mobile_flutter across all planned phases (see BV-WEBPWA-ADR-001, ADR-004) and is now the primary client per CLAUDE.md. apps/mobile_flutter was deliberately left in place and still runs side-by-side (Start BhashaVaani.cmd still starts it on 6002) rather than being deleted in the same session -- removing a whole working app is a separate, explicit decision the user should make once apps/web_pwa has actually been used in practice for a while, not something to do automatically right after the port finishes. When the user is ready: remove apps/mobile_flutter, drop scripts/start-frontend.ps1 and scripts/wait-for-frontend.ps1 (or repurpose wait-for-frontend for the PWA instead), simplify Start BhashaVaani.cmd back to two windows, and update CLAUDE.md/ADR-004 to note the removal actually happened (ADR-004 as written already anticipates this as a future step).

  - id: BV-WEBPWA-PORT-001
    status: resolved
    severity: medium
    title: apps/web_pwa was accidentally pinned to port 6002, colliding with apps/mobile_flutter, and Start BhashaVaani.cmd never launched it at all
    details: Phase 1 scaffolding (BV-WEBPWA-001) set apps/web_pwa's vite.config.ts dev/preview port to 6002, matching apps/mobile_flutter's port instead of picking a distinct one. Fixed first pass (2026-08-02): moved apps/web_pwa to 127.0.0.1:6003, apps/api/app/main.py CORS now allows both 6002 and 6003. That alone still wasn't enough -- the user then reported "This site can't be reached" on 6003 after running Start BhashaVaani.cmd, because that launcher only ever started the backend (6001) and the Flutter frontend (6002) via scripts/start-frontend.ps1; nothing started apps/web_pwa's dev server at all, on any port. Fixed second pass (2026-08-02): added scripts/start-web-pwa.ps1 (runs npm install automatically if node_modules is missing, then npm run dev), wired it into Start BhashaVaani.cmd as a third window alongside backend/Flutter, and added 6003 to scripts/stop-dev-ports.ps1's default port list. Third pass same day: the user's "Web PWA" window opened and closed immediately, before the URL was ever reachable. Root cause was the script itself, not the app -- it used $ErrorActionPreference = "Stop" with no try/catch or pause, so on PowerShell 7.3+ any native-command stderr output or non-zero exit (npm produces this routinely even for warnings, and npm was possibly not resolvable at all in a -NoProfile shell if Node was installed via nvm/volta with PATH set by a profile script) silently killed the window before anything was visible. Rewrote scripts/start-web-pwa.ps1: no ErrorActionPreference=Stop, explicit npm-on-PATH check, explicit node_modules/vite-binary completeness check (reinstalls if incomplete, covering the possibility that node_modules was left partially broken by the failed vite-plugin-pwa install attempts during BV-WEBPWA-001 scaffolding), and every exit path now prints the real error and waits for a keypress instead of closing instantly. Verified vite dev boots on 6003 and returns HTTP 200.

  - id: BV-WEBPWA-ADR-001
    status: resolved
    severity: low
    title: ADR-001 (Flutter-first) not yet formally superseded despite web_pwa migration starting -- RESOLVED via ADR-004
    details: On 2026-08-02, the user decided to replace apps/mobile_flutter with a Vite/React PWA (apps/web_pwa) — see BV-WEBPWA-001 in change-log.yaml — because the Flutter Web wasm build/dev loop was felt to be unnecessary heavy lifting for this app's actual needs. Scope was explicitly narrowed to web-only (no Capacitor/TWA Android wrapper planned). Migration happened side-by-side across phases 1-7 the same day: scaffold -> API client/shell -> lesson session with Web Speech API audio -> progress dashboard/offline outbox -> tutor pet/roadmap -> hand-written PWA manifest/service worker -> this cutover-docs phase. RESOLVED: docs/decisions/ADR-004-vite-react-pwa-frontend.md written, superseding ADR-001; CLAUDE.md updated throughout (product direction, repository map, architecture rules, implemented capabilities, validation commands, workflow step 8, near-term roadmap) to name apps/web_pwa as primary and apps/mobile_flutter as legacy-but-still-running. apps/mobile_flutter was deliberately NOT deleted -- see BV-WEBPWA-RETIRE-001 for that follow-up decision.

  - id: BV-LESSON-GEN-002
    status: open
    severity: medium
    title: "Generate plan failed with \"Ollama returned an empty response\" for all 3 tutor attempts"
    details: Reported 2026-08-02 via apps/web_pwa's Generate plan action (calls the same /lesson-journey/generate endpoint both frontends share). This is a different failure mode than BV-LESSON-GEN-001 (which was malformed/truncated JSON) -- here Ollama's /api/generate returned HTTP 200 with a completely empty "response" field, on every attempt, for the tutor step specifically. Likely cause -- provider_config.yaml's default model was qwen3:30b, a hybrid-reasoning ("thinking") model; combined with format=json and the tutor step's num_predict budget, Ollama versions that support extended thinking for such models can spend the whole generation budget on <think> tokens and never emit the JSON, coming back with response="". Mitigated 2026-08-02: apps/api/app/provider_gateway.py generate_with_ollama now sends "think": false in the request payload (Ollama 0.9+; ignored harmlessly by versions/models that don't support it), plus richer empty-response diagnostics. RESOLVED (worked around) same day: the user confirmed generation succeeds using gemma4:latest instead, so platform/provider_gateway/provider_config.yaml's default model was switched from qwen3:30b to gemma4:latest. The "think": false change stays in place regardless (harmless, and helps if qwen3 is ever selected again via the model picker).

  - id: BV-LESSON-GEN-001
    status: resolved
    severity: medium
    title: Local Ollama models do not yet reliably return reviewed lesson JSON
    details: The two-model /lesson-journey/generate endpoint is implemented and validates output before persistence, but tested Ollama model combinations returned empty or malformed JSON. The backend now rejects unsafe output instead of saving it. On 2026-07-31, apps/api/app/lesson_generator.py was updated with a target-count-scaled token budget (previous fixed 350-token budget could truncate larger plans) and a 3-attempt retry/repair loop that feeds parse errors back to the model. Covered by new unit tests against fake providers.

      RESOLVED 2026-08-02: combined with the BV-LESSON-GEN-002 fix (think:false, gemma4:latest default), the user has since generated multiple full lesson plans successfully in normal day-to-day use (the plan that surfaced BV-REPEAT-CATALOG-001, and several request_text-driven plans while building/testing Stage 1.3's "teach me X" launcher), with no reported generation failures since. Closed on the basis of this sustained live usage rather than a separately-run isolated 5-consecutive-generation test harness, which was never built as its own artifact -- see docs/product/roadmap-learning-features.md Stage 1.1 for the same reasoning. Reopen this if generation failures resume.

  - id: BV-VOICE-STOPGAP-001
    status: open
    severity: low
    title: Lesson screen Play/Record buttons use temporary browser voice APIs, not the provider gateway
    details: The Play phrase and Record answer buttons on the lesson screen were previously no-ops (onPressed was an empty closure). They now use flutter_tts and speech_to_text directly on-device (apps/mobile_flutter/lib/core/voice/voice_service.dart) so they work today, but this bypasses the provider gateway entirely, cannot guarantee a consistent voice per learner profile, and Kannada/Hindi coverage depends on what the browser/OS has installed. Stage 3 of docs/product/roadmap-learning-features.md replaces this with provider-gateway STT/TTS and a per-profile voice_id. The project also has no android/ or ios/ platform folders yet, so native permissions (RECORD_AUDIO, NSMicrophoneUsageDescription, etc.) for these packages have not been configured anywhere. On 2026-07-31, Play phrase was switched to speak the catalog's native_script field (e.g. ನಮಸ್ಕಾರ) instead of the romanized "phrase" field, and VoiceService now reports whether a matching-language voice was actually found vs. a fallback voice was used, with a SnackBar warning in the fallback case rather than silently mispronouncing.

  - id: BV-GENERATE-SILENT-FAIL-001
    status: resolved
    severity: high
    title: "\"Generate plan\" silently fell back to the same 12 starter phrases with a false success message"
    details: Root cause was in apps/mobile_flutter/lib/features/learning_session/domain/lesson_repository.dart -- the backend's /lesson-journey/generate returns HTTP 200 with {"accepted": false, "error": "..."} when generation is rejected (nothing saved, by design). The Flutter client never checked "accepted"; it just read the missing "activities" key as an empty list, showed "Generated adaptive lesson plan" (false success), and then _refreshProgress() -> _refreshLessonJourney() immediately re-fetched the unchanged starter catalog since no new plan existed. Fixed 2026-07-31: generateJourneyActivities now throws LessonGenerationException with the backend's real error when accepted is false, and bhasha_vaani_app.dart surfaces that reason to the user (with a distinct error-styled badge, completionMessageIsError) instead of claiming success. The underlying reason generation was failing every time is almost certainly BV-LESSON-GEN-001 (Ollama not running/no models, or JSON still invalid after retries) -- this fix makes that failure visible instead of masking it, it does not by itself guarantee generation succeeds.

  - id: BV-NEXT-NOSAVE-001
    status: resolved
    severity: high
    title: "Next button never saved progress, making it look like the same phrases repeated"
    details: The lesson screen's Next/Back navigation buttons (in _SessionPanel) were entirely separate from the explicit "Complete" button on the lesson card. A learner who paged through activities with Next without also pressing Complete on each one never triggered onActivityCompleted, so no progress event was ever recorded server-side. completed_activities stayed 0, and the next time the journey was fetched, recommend_lesson_journey's next_index calculation (based on completed_count) started over from the top of the same plan -- looking exactly like "the same phrases again". Fixed 2026-08-01: apps/mobile_flutter/lib/features/learning_session/presentation/learning_session_screen.dart's _next() now auto-completes the current activity (if not already completed) before advancing, so simply progressing through a lesson counts as progress like a normal learner would expect. The explicit Complete button still exists for marking without navigating.

  - id: BV-NEXT-STUCK-001
    status: resolved
    severity: high
    title: "Next button appeared to do nothing except refresh the page"
    details: Regression introduced by the BV-NEXT-NOSAVE-001 fix. _next() in apps/mobile_flutter/lib/features/learning_session/presentation/learning_session_screen.dart completes the current activity via onActivityCompleted before advancing, but that callback (bhasha_vaani_app.dart _recordActivityCompleted) refetches the lesson journey from the backend twice (_refreshProgress -> _refreshLessonJourney, then another explicit _refreshLessonJourney), each producing a brand-new List<LessonActivity> instance even when the activities themselves are unchanged. didUpdateWidget compared oldWidget.activities != widget.activities by reference, so every refetch was treated as "the lesson changed", resetting activityIndex to 0 and clearing completedActivityIds right after _next() had just advanced it, leaving the learner stuck oscillating on the second card while the screen visibly rebuilt (looked like a page refresh). Fixed 2026-08-02: didUpdateWidget now compares activity lists by id content (_sameActivityIds) and only resets position/progress when the underlying set of activities actually changed. Not yet re-validated against a live `flutter build web --wasm` run on the user's machine.

  - id: BV-REPEAT-CATALOG-001
    status: resolved
    severity: low
    title: Regenerating a plan can still reproduce mostly-overlapping phrases once most of the small catalog is covered
    details: On 2026-08-01, lesson generation was changed to look up the profile's already-completed catalog phrases and instruct the tutor model to prefer not-yet-learned ones (apps/api/app/storage.py get_completed_catalog_pairs, apps/api/app/lesson_generator.py _build_tutor_prompt). This is a best-effort prompt hint the model can still ignore, and it's fundamentally limited by catalog size -- Kannada only has 12 starter phrases total, so once most/all are completed, new plans necessarily become review with a lot of overlap by design, not by bug. Real fix is expanding curriculum size (see near-term roadmap item 3 in CLAUDE.md), which is a content task, not a code task. Reported again 2026-08-02 by the user via apps/web_pwa after Generate plan started succeeding (post BV-LESSON-GEN-002 fix) -- confirmed same root cause. First response: added tools/generate_catalog_phrases.py, a CLI that generates and directly writes candidate phrases. The user then asked for a human-in-the-loop UI instead of blind auto-write, so that was superseded/complemented same day by apps/api/app/catalog_generator.py (shared generate/approve logic, used by both the CLI and new endpoints) plus a new Catalog tab in apps/web_pwa (src/features/catalog/): generate candidates, review/edit each field inline, check/uncheck per-phrase, and only approved ones get POSTed to /catalog/{language}/approve and written to starter.json. Structural validation only (non-empty fields, no duplicates) -- linguistic correctness of generated native-script text is NOT automatically verified, which is exactly why the approval step exists.

      RESOLVED 2026-08-02 (part 2): user grew the Kannada catalog to 22 activities and Hindi to 16 via the Catalog tab (confirmed on disk), but reported that newly approved phrases still weren't showing up in generated plans. Root cause was that the "prefer not-yet-learned phrases" instruction in _build_tutor_prompt is only a soft hint -- gemma4:latest (and small local models generally) kept re-selecting the same familiar phrases from earlier in the catalog list rather than genuinely sampling the newly-appended ones at the end. Fixed with a new deterministic backend step, _ensure_new_phrase_coverage in apps/api/app/lesson_generator.py: after the tutor/reviewer models produce and validate a plan, if fewer than half the activities are not-yet-completed catalog items, the backend tops up the plan itself from the catalog's not-yet-completed pool (replacing already-completed/review items first), instead of relying purely on model choice. Everything injected is still catalog-only content, consistent with the "LLM outputs must be validated before persistence" rule. Covered by a new regression test (test_tops_up_plan_with_new_catalog_items_model_ignored in test_lesson_generator.py) that reproduces a model stubbornly returning only already-learned phrases and asserts the final plan still surfaces at least 2 not-yet-learned catalog items. Not yet re-validated against a live Ollama run on the user's machine.

  - id: BV-WHITESCREEN-001
    status: resolved
    severity: medium
    title: First page load showed a blank white screen until a hard refresh
    details: Start BhashaVaani.cmd opened the browser on a fixed 8-second timer while scripts/start-frontend.ps1 ran `flutter run -d web-server` (a debug dev server that compiles on first request). If the browser opened before that finished, the page stayed blank until the compile caught up, and a manual hard refresh was needed to see it. Fixed 2026-07-31: start-frontend.ps1 now runs `flutter build web --wasm` and serves the finished build as static files (no first-request compile race), and the .cmd file now polls scripts/wait-for-frontend.ps1 until the server actually responds before opening the browser, instead of guessing with a fixed timer. Not yet confirmed on the user's real machine -- flag this issue again if the white screen recurs.

  - id: BV-TOOLING-001
    status: resolved
    severity: medium
    title: Flutter CLI hangs during version checks
    details: Initial version checks timed out, but escalated Flutter commands completed. Tests, analysis, and web build passed on 2026-07-31.

  - id: BV-DEPLOY-001
    status: open
    severity: medium
    title: Remote Flutter Web needs authenticated backend access
    details: Firebase-hosted frontend will need Firebase Auth, CORS, and a secure tunnel before it can safely call the local backend from anywhere.
